name: iOS CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: xcodebuild -project PharmaNear.xcodeproj -scheme PharmaNear -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/pharmanear-build" CODE_SIGNING_ALLOWED=NO build
      - name: Launch simulator and capture UI evidence
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone") and x.get("isAvailable",False)))')"
          trap 'xcrun simctl shutdown "$DEVICE" || true' EXIT
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$RUNNER_TEMP/pharmanear-build/Build/Products/Debug-iphonesimulator/PharmaNear.app"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState unplugged --batteryLevel 100
          mkdir -p ui-evidence
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl launch "$DEVICE" com.mykoladotsenko.pharmanear
          sleep 3
          xcrun simctl io "$DEVICE" screenshot ui-evidence/iphone-light.png
          xcrun simctl ui "$DEVICE" appearance dark
          sleep 2
          xcrun simctl io "$DEVICE" screenshot ui-evidence/iphone-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-evidence
          path: ui-evidence/
          if-no-files-found: warn

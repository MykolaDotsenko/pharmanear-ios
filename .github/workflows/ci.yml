name: iOS CI
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check String Catalogs against the app
        run: python3 scripts/check-strings.py
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive Package.swift Sources Tests App UITests
      - name: Report canonical formatting for radar patch
        if: failure()
        run: |
          xcrun swift-format format --in-place App/PharmacyRadarView.swift App/RadarLocation.swift App/ContentView.swift App/ResultsSection.swift Sources/PharmacyCore/RadarGeometry.swift Tests/PharmacyCoreTests/RadarGeometryTests.swift
          python3 - <<'PY'
          import json, pathlib, subprocess
          for path in ["App/PharmacyRadarView.swift","App/RadarLocation.swift","App/ContentView.swift","App/ResultsSection.swift","Sources/PharmacyCore/RadarGeometry.swift","Tests/PharmacyCoreTests/RadarGeometryTests.swift"]:
              if subprocess.run(['git','diff','--quiet','--',path]).returncode:
                  print('RADAR_FORMAT '+json.dumps({'path':path,'content':pathlib.Path(path).read_text()},ensure_ascii=True))
          PY
      - run: swift test
      - name: Choose an iPhone simulator
        run: |
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone") and x.get("isAvailable",False)))')"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Build and run the UI tests
        run: xcodebuild test -project PharmaNear.xcodeproj -scheme PharmaNear -destination "id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/pharmanear-build" -resultBundlePath "$RUNNER_TEMP/PharmaNear.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Export UI test screenshots
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path "$RUNNER_TEMP/PharmaNear.xcresult" --output-path ui-test-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-test-screenshots
          path: ui-test-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/PharmaNear.xcresult
      - name: Capture light, dark, Finnish and Swedish start screens
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          trap 'xcrun simctl shutdown "$DEVICE" || true' EXIT
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$RUNNER_TEMP/pharmanear-build/Build/Products/Debug-iphonesimulator/PharmaNear.app"
          BUNDLE=com.mykoladotsenko.pharmanear
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100
          mkdir -p ui-evidence
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot ui-evidence/iphone-light.png
          xcrun simctl ui "$DEVICE" appearance dark
          sleep 2
          xcrun simctl io "$DEVICE" screenshot ui-evidence/iphone-dark.png
          # The app follows the system language; launch arguments select one without changing the device.
          xcrun simctl terminate "$DEVICE" "$BUNDLE"
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl launch "$DEVICE" "$BUNDLE" -AppleLanguages "(fi)" -AppleLocale fi_FI
          sleep 3
          xcrun simctl io "$DEVICE" screenshot ui-evidence/iphone-finnish.png
          xcrun simctl terminate "$DEVICE" "$BUNDLE"
          xcrun simctl launch "$DEVICE" "$BUNDLE" -AppleLanguages "(sv)" -AppleLocale sv_FI
          sleep 3
          xcrun simctl io "$DEVICE" screenshot ui-evidence/iphone-swedish.png
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: ios-ui-evidence
          path: ui-evidence/
          if-no-files-found: warn
